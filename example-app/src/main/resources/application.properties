server.port=7070

spring.application.name=sidekick-example

agent.state-directory=../data/state
agent.working-directory=../data/workspace

agent.llm.default.model=x-ai/grok-4.6
agent.llm.default.provider=xai/zdr
agent.llm.default.reasoning-effort=medium

agent.tools.bash.enabled=true
agent.tools.bash.network-enabled=true
agent.tools.bash.timeout=120
agent.tools.bash.provider=bwrap

agent.tools.bash.bwrap.rootfs=./data/sandbox/bash-rootfs
agent.tools.bash.bwrap.max-output-bytes=51200
agent.tools.bash.bwrap.uid=65534
agent.tools.bash.bwrap.gid=65534
