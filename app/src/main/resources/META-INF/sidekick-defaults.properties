agent.name=Sidekick
agent.state-directory=./data/state
agent.working-directory=./data/workspace

agent.llm.fast.model=openai/gpt-5.6-luna
agent.llm.fast.provider=openai
agent.llm.fast.reasoning-effort=low

agent.llm.default.model=z-ai/glm-5.2
agent.llm.default.provider=decart/fp4
agent.llm.default.reasoning-effort=high

agent.llm.ultrathink.model=openai/gpt-5.6-sol
agent.llm.ultrathink.provider=openai
agent.llm.ultrathink.reasoning-effort=xhigh

agent.llm.image.model=openai/gpt-5.6-luna

adapters.http.enabled=false
adapters.http.token=

agent.tools.bash.enabled=false
agent.tools.bash.provider=http
agent.tools.bash.network-enabled=false
agent.tools.bash.timeout=120
agent.tools.bash.http.base-url=
agent.tools.bash.http.token=

adapters.slack.bot.token=
adapters.slack.bot.signing-secret=

agent.weekly-stats.enabled=false
agent.weekly-stats.channel-id=
agent.weekly-stats.cron=0 0 9 * * MON

adapters.open-router.api-key=
adapters.open-router.app-url=https://github.com/deil/junior-sidekick

